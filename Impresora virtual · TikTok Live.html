<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Impresora virtual · TikTok Live</title>
<style>
:root{--bg:#0b0b0f;--ink:#1a1208;--gold:#ffc83d;--pink:#ff2d6f;--cy:#19e3ff;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
#stage{--b:10cqh;position:relative;height:100%;aspect-ratio:9/16;max-width:100%;margin:0 auto;overflow:hidden;container-type:size;background:repeating-linear-gradient(90deg,#00000022 0 2px,transparent 2px 16%),radial-gradient(circle at 50% 40%,#a8773a,#4d2d12 85%)}
#stage.clean{--b:3cqh}
#stage::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 5cqh #ff2d6f66,inset 0 0 11cqh #19e3ff44;pointer-events:none;z-index:30}
.printer{position:absolute;top:0;left:0;right:0;height:16cqh;background:linear-gradient(#2d2d35,#0b0b0d);border-bottom:.6cqh solid #666;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1cqh;z-index:6}
.lab{color:#fff;font-weight:900;letter-spacing:.35cqh;font-size:2.5cqh;text-shadow:0 0 10px var(--pink),0 0 22px var(--cy)}
#rank{display:flex;gap:1cqh;flex-wrap:nowrap;justify-content:center;max-width:96%}
#rank span{background:#ffffff1a;border:1px solid #ffffff44;color:var(--gold);font-weight:800;font-size:1.6cqh;padding:.4cqh 1.2cqh;border-radius:2cqh;white-space:nowrap;max-width:30cqh;overflow:hidden;text-overflow:ellipsis}
#qn{position:absolute;right:2cqh;top:1.2cqh;color:var(--cy);font-weight:800;font-size:1.8cqh}
.rod{position:absolute;top:13cqh;bottom:14cqh;width:2.4%;background:linear-gradient(90deg,#555,#f2f2f2,#555);border-radius:8px;z-index:4}
.rod.l{left:3%}.rod.r{right:3%}
.rail{position:absolute;top:21cqh;left:3%;right:3%;height:1.3cqh;background:linear-gradient(#eee,#777);z-index:7;border-radius:4px}
.head{position:absolute;left:40%;top:-2.2cqh;width:16%;height:5.5cqh;background:linear-gradient(#d8d8d8,#555 60%,#222);border-radius:6px;box-shadow:0 .6cqh 1cqh #0008}
.head::after{content:"";position:absolute;left:46%;bottom:-.8cqh;width:8%;height:1cqh;background:var(--pink);box-shadow:0 0 12px var(--pink)}
.go .head{animation:sw .3s ease-in-out infinite alternate}
@keyframes sw{from{left:6%}to{left:78%}}
#paper{position:absolute;top:17cqh;left:13%;width:74%;bottom:-3cqh;background:linear-gradient(90deg,#e1d7ba,#f7f1df 50%,#e1d7ba);box-shadow:0 1cqh 3cqh #000a;padding:6cqh 0 0;overflow:hidden;display:flex;flex-direction:column;align-items:center;gap:1cqh;border-radius:0 0 6cqh 6cqh/0 0 4cqh 4cqh;z-index:3}
#paper::after{content:"";position:absolute;inset:auto 0 0 0;height:16cqh;background:linear-gradient(transparent,#00000077);pointer-events:none}
.perf{position:absolute;top:17cqh;bottom:0;width:3cqh;z-index:4;background:radial-gradient(circle,#0005 .5cqh,transparent .65cqh) 0 0/3cqh 3cqh}
.perf.l{left:13%}.perf.r{left:calc(87% - 3cqh)}
.card{width:76%;height:0;flex:none;position:relative;overflow:hidden;animation:grow .9s linear forwards}
@keyframes grow{to{height:20cqh}}
.in{position:absolute;top:0;left:0;right:0;height:20cqh;background:#fbf7ea;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.6cqh;border:.35cqh solid var(--ink);box-shadow:inset 0 0 0 .5cqh #fbf7ea,inset 0 0 0 .8cqh #c9a24a}
.in::before,.in::after{content:"✦";position:absolute;top:.8cqh;color:#c9a24a;font-size:2cqh}
.in::before{left:1.4cqh}.in::after{right:1.4cqh}
.in img{width:10.5cqh;height:10.5cqh;border-radius:50%;object-fit:cover;border:.5cqh solid var(--ink);box-shadow:0 0 0 .5cqh #c9a24a}
.nm{font-family:"Brush Script MT","Segoe Script","Snell Roundhand",cursive;font-size:3.3cqh;color:var(--ink);max-width:88%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bd{font-style:normal;font-size:1.6cqh;font-weight:800;color:#fff;background:var(--ink);padding:.3cqh 1.4cqh;border-radius:2cqh}
.card.gift .in{border-color:#9a6b00;background:linear-gradient(110deg,#fff3c4 30%,#fff 50%,#ffe08a 70%) 0 0/250% 100%;animation:sh 1.1s linear infinite,gl 1s ease-in-out infinite}
@keyframes gl{50%{filter:brightness(1.2) saturate(1.3)}}
.card.gift .in::before,.card.gift .in::after{content:"✨"}
.card.gift .bd{background:linear-gradient(90deg,#b8860b,#ff2d6f);}
@keyframes sh{to{background-position:-250% 0}}
.hint{position:absolute;left:0;right:0;bottom:calc(var(--b) + 1cqh);text-align:center;color:#fff;font-weight:900;font-size:2.2cqh;padding:0 6%;text-shadow:0 .3cqh 1cqh #000;animation:pulse 1.6s ease-in-out infinite;z-index:8;pointer-events:none}
@keyframes pulse{50%{transform:scale(1.05)}}
#goal{position:absolute;left:8%;right:8%;bottom:var(--b);height:5cqh;background:#000a;border:.3cqh solid #fff6;border-radius:3cqh;overflow:hidden;z-index:8}
#gf{height:100%;width:0;background:linear-gradient(90deg,var(--pink),var(--gold),var(--cy));transition:width .5s}
#gt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:2cqh;text-shadow:0 0 6px #000}
.sp{position:absolute;z-index:2;font-size:3cqh;animation:tw 2.4s ease-in-out infinite}
@keyframes tw{50%{opacity:.2;transform:scale(1.5) rotate(25deg)}}
#ctl{position:absolute;left:0;right:0;bottom:0;display:flex;flex-wrap:wrap;gap:.8cqh;justify-content:center;padding:1cqh;background:#000b;z-index:9}
#ctl button{font:700 1.7cqh system-ui;padding:.9cqh 1.4cqh;border:0;border-radius:2cqh;background:#fff;color:#111;cursor:pointer}
#ctl button:hover{background:var(--gold)}
#bot{position:absolute;left:4%;right:4%;bottom:calc(var(--b) + 6.5cqh);z-index:9;display:flex;flex-direction:column;gap:1cqh;align-items:flex-start;pointer-events:none}
.bub{max-width:100%;background:#000c;border:.3cqh solid var(--cy);border-radius:2.4cqh;padding:1cqh 1.8cqh;color:#fff;font-size:2cqh;font-weight:600;animation:bin .35s cubic-bezier(.2,1.5,.4,1);transition:opacity .5s}
.bub b{color:var(--cy);margin-right:1cqh}
.bub.out{opacity:0}
@keyframes bin{from{transform:translateY(2cqh) scale(.8);opacity:0}}
#fx{position:absolute;inset:0;z-index:25;pointer-events:none;overflow:hidden}
#big{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2cqh;background:radial-gradient(circle,#ff2d6fdd,#3b0a5ef0 70%);opacity:0;pointer-events:none;transition:opacity .3s;overflow:hidden}
#big.on{opacity:1}
#big::before{content:"";position:absolute;width:170cqh;height:170cqh;background:repeating-conic-gradient(#ffffff22 0 10deg,transparent 10deg 20deg);animation:spin 8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#bimg{position:relative;width:34cqh;height:34cqh;border-radius:50%;object-fit:cover;border:1cqh solid var(--gold);box-shadow:0 0 6cqh var(--gold)}
#big.on #bimg{animation:pop .7s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(0) rotate(-30deg)}}
#bth{position:relative;color:var(--gold);font-weight:900;font-size:6.5cqh;text-shadow:0 .5cqh 0 #000}
#bnm{position:relative;color:#fff;font-weight:900;font-size:5cqh;max-width:90%;text-align:center;overflow-wrap:anywhere}
#bgf{position:relative;color:#fff;font-weight:700;font-size:3cqh}
.cf{position:absolute;top:-10cqh;animation:fall 3s linear forwards;z-index:2}
@keyframes fall{to{transform:translateY(120cqh) rotate(540deg)}}
</style>
</head>
<body>
<div id="stage">
  <div class="sp" style="left:5%;top:30%">✨</div><div class="sp" style="right:5%;top:42%;animation-delay:.8s">⭐</div><div class="sp" style="left:6%;top:60%;animation-delay:1.4s">💖</div><div class="sp" style="right:6%;top:70%;animation-delay:.4s">✨</div>
  <div class="printer"><div class="lab">🖨️ IMPRESORA DE FANS</div><div id="rank"></div><div id="qn"></div></div>
  <div class="rod l"></div><div class="rod r"></div>
  <div class="rail"><div class="head"></div></div>
  <div id="paper"></div>
  <div class="perf l"></div><div class="perf r"></div>
  <div class="hint" id="hint">100 ❤️, un follow o un regalo y tu foto sale impresa</div>
  <div id="ctl">
    <button data-t="like">❤️ 100 likes</button>
    <button data-t="follow">➕ Seguidor</button>
    <button data-t="join">👋 Entra</button>
    <button data-t="gift">🌹 Regalo</button>
    <button data-t="big">🍩 Dona</button>
    <button data-t="voz">🔇 Voz</button>
    <button data-t="chat">💬 Chat</button>
    <button data-t="music">🎵 Música</button>
    <button data-t="demo">🔥 Ráfaga</button>
  </div>
  <div id="bot"></div>
  <div id="fx"></div>
  <div id="big"><img id="bimg" alt=""><div id="bth">¡GRACIAS!</div><div id="bnm"></div><div id="bgf"></div></div>
</div>
<script>
const $=s=>document.querySelector(s),P=new URLSearchParams(location.search);
const CLEAN=P.has("clean"),BIG=+P.get("big")||30,STEP=+P.get("likes")||100,GOAL=+P.get("goal")||2000;
if(CLEAN){$("#ctl").hidden=true;$("#stage").classList.add("clean")}
let ac;
function tone(f,d,t,v,w){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain(),n=ac.currentTime+w;o.type=t;o.frequency.value=f;g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g);g.connect(ac.destination);o.start(n);o.stop(n+d)}catch(e){}}
const printSnd=n=>{for(let i=0;i<n;i++)nz(.07,.1,i*.1,900+Math.random()*500)};
const dingSnd=()=>[880,1175,1568].forEach((f,i)=>tone(f,.25,"triangle",.18,i*.08));
const bigSnd=()=>[523,659,784,1047,1319,1568].forEach((f,i)=>tone(f,.4,"sawtooth",.1,i*.1));
function nz(d,v,w,f){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const n=ac.currentTime+w,l=ac.sampleRate*d|0,b=ac.createBuffer(1,l,ac.sampleRate),a=b.getChannelData(0);for(let i=0;i<l;i++)a[i]=Math.random()*2-1;const s=ac.createBufferSource(),q=ac.createBiquadFilter(),g=ac.createGain();q.type="bandpass";q.frequency.value=f;s.buffer=b;g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.001,n+d);s.connect(q);q.connect(g);g.connect(ac.destination);s.start(n)}catch(e){}}
let mus=null;
function music(on){if(!on){clearInterval(mus);mus=null;return}try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();ac.resume()}catch(e){return}
const ch=[[261.6,329.6,392,493.9],[220,261.6,329.6,392],[174.6,220,261.6,329.6],[196,246.9,293.7,392]],sc=[523,587,659,784,880];let i=0;
const play=()=>{const c=ch[i++%4];c.forEach((f,k)=>tone(f,3.7,"sine",.035,k*.35));tone(c[0]/2,3.8,"sine",.05,0);tone(sc[Math.random()*5|0],1.8,"triangle",.02,1.2)};
play();mus=setInterval(play,3800)}
function avatar(u){if(u.avatar)return u.avatar;let h=7;for(const c of u.name)h=(h*31+c.charCodeAt(0))|0;h=Math.abs(h);
const s="<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='hsl("+h%360+",80%,58%)'/><stop offset='1' stop-color='hsl("+(h+60)%360+",80%,38%)'/></linearGradient></defs><rect width='100' height='100' fill='url(#g)'/><text x='50' y='66' font-size='48' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='700'>"+u.name[0].toUpperCase().replace(/[<>&]/g,"?")+"</text></svg>";
return "data:image/svg+xml;utf8,"+encodeURIComponent(s)}
function burst(par,n,ms,em){for(let i=0;i<n;i++){const s=document.createElement("span");s.className="cf";s.textContent=em[i%em.length];s.style.cssText="left:"+Math.random()*100+"%;animation-delay:"+Math.random()*ms/2000+"s;font-size:"+(3+Math.random()*4)+"cqh";par.append(s);setTimeout(()=>s.remove(),ms+1500)}}
/* cola: regalos primero; el que repite espera su turno; luego seguidores, likes y entradas */
const Q=[];let busy=false,hold=false;
function push(ev){ev.t=Date.now();if((ev.pr===3&&Q.filter(x=>x.pr===3).length>25)||(ev.pr===2&&Q.filter(x=>x.pr===2).length>40))return;
Q.push(ev);Q.sort((a,b)=>a.pr-b.pr||(a.rank||0)-(b.rank||0)||a.t-b.t);$("#qn").textContent=Q.length?"⏳ "+Q.length:"";pump()}
async function pump(){if(busy||hold||!Q.length)return;busy=true;const ev=Q.shift();$("#qn").textContent=Q.length?"⏳ "+Q.length:"";if(ev.big)await showBig(ev);await printCard(ev);busy=false;pump()}
function printCard(ev){return new Promise(res=>{const dur=Q.length>4?500:Q.length>1?700:900;
const c=document.createElement("div");c.className="card"+(ev.gift?" gift":"");c.style.animationDuration=dur+"ms";
c.innerHTML="<div class='in'><img alt=''><b class='nm'></b><i class='bd'></i></div>";
c.querySelector("img").src=avatar(ev.u);c.querySelector(".nm").textContent=ev.u.name;c.querySelector(".bd").textContent=ev.badge;
const p=$("#paper"),st=$("#stage");p.prepend(c);st.classList.add("go");printSnd(Math.round(dur/100));
setTimeout(()=>{st.classList.remove("go");if(ev.gift){dingSnd();burst($("#fx"),10,1500,["✨","💖","⭐"])}while(p.children.length>5)p.lastChild.remove();setTimeout(res,ev.gift?450:120)},dur+30)})}
function showBig(ev){return new Promise(res=>{const b=$("#big");$("#bimg").src=avatar(ev.u);$("#bnm").textContent=ev.u.name;$("#bgf").textContent=ev.badge;b.classList.add("on");bigSnd();burst(b,36,4000,["🍩","✨","💖","🎉","⭐"]);
setTimeout(()=>{b.classList.remove("on");setTimeout(res,350)},4500)})}
const rk={};function renderRank(){const el=$("#rank");el.textContent="";Object.entries(rk).sort((a,b)=>b[1]-a[1]).slice(0,3).forEach(([n,c],i)=>{const s=document.createElement("span");s.textContent=["🥇","🥈","🥉"][i]+" "+n+" · "+c;el.append(s)})}
function addPts(){}
addPts(0);
const likes={},done={},joined=new Set();
window.handleEvent=e=>{const u={name:String(e.user||e.nickname||"fan"),avatar:e.avatar||e.profilePictureUrl||""};
if(e.type==="like"){const n=e.count||1;likes[u.name]=(likes[u.name]||0)+n;addPts(n);const m=Math.floor(likes[u.name]/STEP);if(m>(done[u.name]||0)){done[u.name]=m;push({u,pr:2,badge:"❤️ "+m*STEP+" likes"})}}
else if(e.type==="follow")push({u,pr:1,badge:"➕ Nuevo seguidor"});
else if(e.type==="join"){if(!joined.has(u.name)){joined.add(u.name);push({u,pr:3,badge:"👋 Entró al live"})}}
else if(e.type==="gift"){const q=e.qty||1,c=(e.coins||1)*q;rk[u.name]=(rk[u.name]||0)+c;renderRank();addPts(c*20);
const big=(e.coins||0)>=BIG||/donut|dona/i.test(e.gift||"");
push({u,pr:0,gift:1,big,rank:Q.filter(x=>x.gift&&x.u.name===u.name).length,badge:"🎁 "+(e.gift||"Regalo")+(q>1?" ×"+q:"")})}};
const names=["Valentina","Sehzade","Carlos_88","Luna","Kody","Mariana","Juancho","Sofi"],rn=()=>names[Math.random()*names.length|0];
function demo(){hold=true;["Luna","Kody","Mari"].forEach(n=>handleEvent({type:"join",user:n}));handleEvent({type:"like",user:"Sofi",count:STEP});handleEvent({type:"follow",user:"Sehzade"});
handleEvent({type:"gift",user:"Valentina",gift:"Rosa",coins:1});handleEvent({type:"gift",user:"Valentina",gift:"Rosa",coins:1});handleEvent({type:"gift",user:"Carlos_88",gift:"Corazón",coins:5});hold=false;pump()}
document.querySelectorAll("#ctl button").forEach(b=>b.onclick=()=>{const t=b.dataset.t,user=rn();
if(t==="like")handleEvent({type:"like",user:user+Math.random().toString(36).slice(2,4),count:STEP});else if(t==="follow")handleEvent({type:"follow",user});
else if(t==="join")handleEvent({type:"join",user:user+Math.random().toString(36).slice(2,4)});
else if(t==="gift")handleEvent({type:"gift",user,gift:"Rosa",coins:1});
else if(t==="big")handleEvent({type:"gift",user,gift:"Dona",coins:30});else if(t==="voz"){voz=!voz;b.textContent=voz?"🔊 Voz":"🔇 Voz";if(voz)hablar("Hola, soy Printy, el bot de la impresora.");else speechSynthesis.cancel()}else if(t==="chat")handleEvent({type:"chat",user,comment:"yo yo yo"});else if(t==="music")music(!mus);else demo()});
function conn(url){try{const w=new WebSocket(url);w.onmessage=m=>{try{handleEvent(JSON.parse(m.data))}catch(e){}};w.onclose=()=>setTimeout(()=>conn(url),4000);w.onerror=()=>{try{w.close()}catch(e){}}}catch(e){}}
if(CLEAN||P.has("ws"))conn(P.get("ws")||"ws://localhost:8080");else setTimeout(demo,700);
if(P.get("yt")){const y=P.get("yt").replace(/[^\w-]/g,""),f=document.createElement("iframe");f.src="https://www.youtube.com/embed/"+y+"?autoplay=1&loop=1&playlist="+y;f.allow="autoplay";f.style.cssText="position:absolute;width:2px;height:2px;opacity:0;border:0;pointer-events:none";$("#stage").append(f)}else if(CLEAN)music(true);
const H=["100 ❤️, un follow o un regalo y tu foto sale impresa","🎁 Cada regalo pasa primero en la cola","🙏 ¡Gracias por estar en el live!","✨ Sigue el perfil y sal en la impresora"];let hi=0;setInterval(()=>{hi=(hi+1)%H.length;$("#hint").textContent=H[hi]},7000);
/* Printy: bot del live (se presenta como bot). Respuestas por reglas; con {type:"bot",text} el servidor puede mandar texto de una IA */
const R=a=>a[Math.random()*a.length|0],TOP=["Dato curioso: casi todo el mundo usa papel A4, menos EE. UU. y Canadá 📄","Pregunta del live: ¿café o jugo para la tarde? ☕","Sigue sonando música suave 🎵 ¿qué canción pondrías?","¿Cuál es el lugar más bonito donde has estado? 🌎","Reto: ¡que salgan 5 fotos seguidas en la impresora! 🖨️"];
const BQ=[];let bb=false,lastRep=0;
function say(t,f){if(!f&&Date.now()-lastRep<5000)return;lastRep=Date.now();BQ.push(t);if(BQ.length>3)BQ.shift();nextSay()}
function nextSay(){if(bb||!BQ.length)return;bb=true;const d=document.createElement("div"),a=document.createElement("b"),s=document.createElement("span"),box=$("#bot");d.className="bub";a.textContent="🤖 Printy";const tx=BQ.shift();s.textContent=tx;hablar(tx);d.append(a,s);box.append(d);while(box.children.length>2)box.firstChild.remove();setTimeout(()=>d.classList.add("out"),6500);setTimeout(()=>d.remove(),7000);setTimeout(()=>{bb=false;nextSay()},3500)}
function botHook(e){const n=String(e.user||e.nickname||"fan");
if(e.type==="bot"){say(String(e.text||"").slice(0,160),1);return}
if(e.type==="gift")say("¡Gracias "+n+" por el regalo! 💖 Ya sale tu tarjeta 🖨️",1);
else if(e.type==="follow")say("¡Bienvenid@ a la familia, "+n+"! 🎉");
else if(e.type==="join"){if(Math.random()<.35)say("¡Hola "+n+"! Dale 100 ❤️ o sigue el perfil y sales en la impresora 🖨️")}
else if(e.type==="chat"){const t=String(e.comment||e.text||"");
if((/^[yo\s!.,]+$/i.test(t)&&/y/i.test(t))||/\bsalir\b|\bimprim/i.test(t))say(R(["Jajaja "+n+", ¡paciencia! La fila avanza y los regalos pasan primero 🖨️","Ya te vi, "+n+" 👀 ¡suelta 100 ❤️ o sigue el perfil para salir!","¡Anotad@, "+n+"! Con 100 ❤️ la impresora trabaja para ti 😎"]));
else if(/\b(hola|buenas|hey|holi)\b/i.test(t))say("¡Hola "+n+"! Qué bueno verte por aquí 👋");
else if(Math.random()<.2)say(R(TOP))}}
const _h=window.handleEvent;window.handleEvent=e=>{_h(e);botHook(e)};
setInterval(()=>{if(Date.now()-lastRep>45000)say(R(TOP),1)},10000);
/* Voz de Printy: sintetizador del navegador, mejor voz en español disponible */
let voz=CLEAN,vz=null;
function pickVoice(){const v=speechSynthesis.getVoices().filter(x=>/^es/i.test(x.lang));vz=v.find(x=>/natural|neural|online/i.test(x.name))||v.find(x=>/google|microsoft/i.test(x.name))||v.find(x=>/es-CO|es-MX|es-US/i.test(x.lang))||v[0]||null}
function hablar(t){if(!voz||!window.speechSynthesis)return;try{const u=new SpeechSynthesisUtterance(t.replace(/@/g,"o").replace(/\u2764\uFE0F?/g,"likes").replace(/[^\p{L}\p{N}\s.,!?¡¿:;-]/gu,""));u.lang="es-CO";if(vz)u.voice=vz;u.rate=1.05;u.pitch=1.1;u.volume=.9;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
try{speechSynthesis.onvoiceschanged=pickVoice;pickVoice();if(CLEAN)document.querySelector("#ctl [data-t=voz]").textContent="🔊 Voz"}catch(e){}
</script>
